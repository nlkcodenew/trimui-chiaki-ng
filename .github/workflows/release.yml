name: Build GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches APP_VERSION
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("files/rh/version.py").read_text(encoding="utf-8")
          match = re.search(r'APP_VERSION\s*=\s*["\x27]([^"\x27]+)', text)
          version = match.group(1).lstrip("v") if match else ""
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          print("version.py=%s tag=%s" % (version, tag))
          if tag != version:
              raise SystemExit("tag does not match APP_VERSION")
          PY

      - name: Compile Python sources
        run: python -m compileall -q files tools

      - name: Build and verify release assets
        run: |
          python tools/make_release.py
          python tools/verify_release.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/trimui-chiaki-ng-v*.zip
            dist/trimui-chiaki-ng-v*.zip.sha256
            manifest.json
